spring.application.name=expense-management-system

server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:h2:mem:expense_management;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=MONTH,YEAR
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
app.expense-attachment.storage-path=${EXPENSE_ATTACHMENT_PATH:uploads/expenses}
