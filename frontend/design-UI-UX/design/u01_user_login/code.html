<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>FinTrack Pro - Sign In</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "border": "#E2E8F0",
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "primary-light": "#eff4ff",
            "secondary": "#515f74",
            "danger": "#DC2626",
            "background": "#faf8ff",
            "bg-subtle": "#F8FAFC",
            "surface": "#FFFFFF",
            "on-background": "#131b2e",
            "on-surface-variant": "#434655"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bg-subtle text-on-background antialiased min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-[420px]">
    <!-- Logo Header -->
    <div class="text-center mb-8">
      <div class="inline-flex justify-center items-center gap-2.5 mb-4">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-primary to-primary-container text-white flex items-center justify-center font-bold text-2xl shadow-md">
          <span class="material-symbols-outlined text-[26px]">account_balance_wallet</span>
        </div>
        <h1 class="text-2xl font-bold text-primary tracking-tight">FinTrack Pro</h1>
      </div>
      <h2 class="text-xl font-bold text-on-background mb-1">Sign In</h2>
      <p class="text-sm text-secondary">Access your personal financial management account.</p>
    </div>

    <!-- Login Card -->
    <div class="bg-surface border border-border rounded-2xl shadow-lg p-8">
      <form action="../u02_user_dashboard/code.html" class="space-y-5" method="GET">
        <!-- Email Field -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-1.5" for="email">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <span class="material-symbols-outlined text-[20px]">mail</span>
            </div>
            <input 
              class="block w-full pl-10 pr-4 py-2.5 border border-border rounded-xl bg-bg-subtle text-on-background text-sm focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder:text-slate-400 transition-colors" 
              id="email" 
              name="email" 
              placeholder="user@fintrack.pro" 
              value="alex.morgan@fintrack.pro" 
              required 
              type="email"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-1.5" for="password">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <span class="material-symbols-outlined text-[20px]">lock</span>
            </div>
            <input 
              class="block w-full pl-10 pr-4 py-2.5 border border-border rounded-xl bg-bg-subtle text-on-background text-sm focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder:text-slate-400 transition-colors" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              value="password123" 
              required 
              type="password"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            class="w-full flex justify-center items-center gap-2 py-3 px-4 rounded-xl shadow-md text-sm font-semibold text-white bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" 
            type="submit"
          >
            <span>Sign In</span>
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Footer info -->
    <div class="mt-8 text-center">
      <p class="text-xs text-slate-400">© 2026 FinTrack Pro. All rights reserved.</p>
    </div>
  </main>

  <script>
    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = this.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> <span>Authenticating...</span>';
      btn.classList.add('opacity-80', 'cursor-not-allowed');
      
      setTimeout(() => {
        window.location.href = '../u02_user_dashboard/code.html';
      }, 600);
    });
  </script>
</body>
</html>
