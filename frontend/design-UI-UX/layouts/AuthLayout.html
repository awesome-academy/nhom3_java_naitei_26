<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Auth Layout — FinTrack Pro</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "border": "#E2E8F0",
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "primary-light": "#eff4ff",
            "secondary": "#515f74",
            "background": "#faf8ff",
            "bg-subtle": "#F8FAFC",
            "surface": "#FFFFFF",
            "danger": "#DC2626",
            "success": "#16A34A",
            "on-background": "#131b2e",
            "on-surface-variant": "#434655"
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #faf8ff; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-50 via-blue-50/30 to-indigo-50/40">

  <div class="w-full max-w-md">
    <!-- Auth Card Slot -->
    <div class="bg-surface rounded-2xl border border-border p-8 shadow-xl">
      <!-- Slot for Brand, Heading, Form inputs, and CTA -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-primary text-white flex items-center justify-center font-bold text-2xl mx-auto shadow-md mb-3">
          <span class="material-symbols-outlined text-[28px]">account_balance_wallet</span>
        </div>
        <h2 class="text-2xl font-bold text-on-background">Sign In</h2>
        <p class="text-sm text-on-surface-variant mt-1">Access your account to continue</p>
      </div>

      <!-- Content goes here -->
    </div>

    <!-- Security footnote -->
    <p class="text-center text-xs text-on-surface-variant mt-6">
      © 2026 FinTrack Pro. All rights reserved. Secure 256-bit SSL encryption.
    </p>
  </div>

</body>
</html>
