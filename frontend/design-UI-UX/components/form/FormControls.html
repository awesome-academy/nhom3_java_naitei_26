<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Form Controls Component — FinTrack Pro</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "border": "#E2E8F0",
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "primary-light": "#eff4ff",
            "secondary": "#515f74",
            "background": "#faf8ff",
            "bg-subtle": "#F8FAFC",
            "surface": "#FFFFFF",
            "danger": "#DC2626",
            "success": "#16A34A",
            "warning": "#D97706",
            "on-background": "#131b2e",
            "on-surface-variant": "#434655"
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #131b2e; }
  </style>
</head>
<body class="p-6 md:p-8 bg-bg-subtle min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Component Header -->
    <div class="border-b border-border pb-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="px-2 py-0.5 rounded bg-purple-100 text-purple-800 text-[11px] font-mono font-bold">CMP-FRM</span>
        <span class="text-xs font-semibold text-secondary">Component Library</span>
      </div>
      <h1 class="text-2xl font-bold text-on-background">Form Input Controls</h1>
      <p class="text-xs text-secondary mt-1">Standard form fields, currency inputs, category selects, textareas, and drag-and-drop dropzones</p>
    </div>

    <!-- Controls Showcase -->
    <div class="bg-surface border border-border rounded-2xl p-6 shadow-xs space-y-6">
      
      <!-- Text & Currency Inputs -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-1.5" for="name">
            Text Input Field <span class="text-danger">*</span>
          </label>
          <input 
            type="text" 
            id="name" 
            placeholder="e.g., Office Supplies" 
            value="Supermarket Grocery"
            class="w-full px-4 py-2.5 bg-bg-subtle border border-border rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-1.5" for="amount">
            Currency Amount Input <span class="text-danger">*</span>
          </label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 font-semibold text-secondary text-sm">$</span>
            <input 
              type="number" 
              step="0.01" 
              id="amount" 
              value="145.50"
              class="w-full pl-8 pr-14 py-2.5 bg-bg-subtle border border-border rounded-xl text-sm font-mono font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
            >
            <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400">USD</span>
          </div>
        </div>
      </div>

      <!-- Select & Date Inputs -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-1.5" for="cat">
            Select Dropdown <span class="text-danger">*</span>
          </label>
          <select 
            id="cat" 
            class="w-full px-4 py-2.5 bg-bg-subtle border border-border rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
          >
            <option value="food" selected>Food & Dining</option>
            <option value="housing">Housing & Utilities</option>
            <option value="transport">Transportation</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-1.5" for="date">
            Date Picker Input <span class="text-danger">*</span>
          </label>
          <input 
            type="date" 
            id="date" 
            value="2026-10-24"
            class="w-full px-4 py-2.5 bg-bg-subtle border border-border rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
          >
        </div>
      </div>

      <!-- Textarea -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-1.5" for="notes">
          Description Textarea
        </label>
        <textarea 
          id="notes" 
          rows="3" 
          placeholder="Enter detailed transaction notes..."
          class="w-full px-4 py-2.5 bg-bg-subtle border border-border rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
        >Weekly household grocery supplies including organic dairy and vegetables.</textarea>
      </div>

      <!-- File Upload Dropzone -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-1.5">
          Receipt File Dropzone
        </label>
        <div class="border-2 border-dashed border-slate-300 hover:border-primary bg-bg-subtle hover:bg-blue-50/20 rounded-xl p-6 text-center cursor-pointer transition-all">
          <span class="material-symbols-outlined text-[32px] text-primary mb-1">cloud_upload</span>
          <p class="text-xs font-semibold text-on-background">Drag & drop receipt here, or browse files</p>
          <p class="text-[10px] text-slate-400 mt-0.5">Supports PDF, PNG, JPG up to 10MB</p>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
