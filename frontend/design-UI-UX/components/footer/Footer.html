<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Footer Component — FinTrack Pro</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "border": "#E2E8F0",
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "primary-light": "#eff4ff",
            "secondary": "#515f74",
            "background": "#faf8ff",
            "bg-subtle": "#F8FAFC",
            "surface": "#FFFFFF",
            "danger": "#DC2626",
            "success": "#16A34A",
            "warning": "#D97706",
            "on-background": "#131b2e",
            "on-surface-variant": "#434655"
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #131b2e; }
  </style>
</head>
<body class="p-6 md:p-8 bg-bg-subtle min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Component Header -->
    <div class="border-b border-border pb-4">
      <div class="flex items-center gap-2 mb-1">
        <span class="px-2 py-0.5 rounded bg-purple-100 text-purple-800 text-[11px] font-mono font-bold">CMP-FTR</span>
        <span class="text-xs font-semibold text-secondary">Component Library</span>
      </div>
      <h1 class="text-2xl font-bold text-on-background">Standard Application Footer</h1>
      <p class="text-xs text-secondary mt-1">Bottom metadata bar with copyright notice, system status, and security compliance badges</p>
    </div>

    <!-- Footer Showcase Card -->
    <div class="bg-surface border border-border rounded-2xl overflow-hidden shadow-xs">
      <footer class="p-6 flex flex-wrap items-center justify-between gap-4 text-xs text-secondary">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5 font-bold text-on-background">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            FinTrack Pro
          </div>
          <span class="text-slate-300">|</span>
          <span>© 2026 Personal Finance System. All rights reserved.</span>
        </div>

        <div class="flex items-center gap-4 text-xs font-medium">
          <a href="#" class="hover:text-primary transition-colors">Privacy Policy</a>
          <a href="#" class="hover:text-primary transition-colors">Terms of Service</a>
          <a href="#" class="hover:text-primary transition-colors">API Docs</a>
          <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-bold border border-emerald-200">v2.4.0 Live</span>
        </div>
      </footer>
    </div>

  </div>
</body>
</html>
